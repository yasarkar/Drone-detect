# Drone Detection and Tracking System Configuration

# Dataset configuration path to dataset YAML containing train/val/test splits and class names
data_yaml_path: "dataset/data.yaml"

# Model hyperparameters
model_type: "yolov8m.pt"         # Pre-trained base weights (yolov8s.pt, yolov8m.pt, etc.)
epochs: 50                       # Number of training epochs
imgsz: 640                       # Input image size (must be divisible by 32)
batch_size: 16                   # Training batch size (use -1 for auto-batching)

# Hardware and environment configurations
device: 0                        # Device index (0, 1... for GPU, or "cpu")

# Output and logging directories
project_dir: "runs/detect"       # Project folder where training run results are saved
name: "drone_model_exp"          # Subdirectory name under project_dir for this experiment

# Inference configuration
weights_path: "weights/best.pt"  # Path to the trained YOLO weights
confidence_threshold: 0.50       # Confidence threshold for detections
iou_threshold: 0.45              # Intersection over Union (IoU) threshold for NMS

# Visualization settings
visuals:
  bbox_color: [0, 255, 0]        # BGR Green
  bbox_thickness: 2
  font_scale: 0.6

# SAHI (Slicing Aided Hyper Inference) settings
sahi:
  enabled: false                 # Toggle SAHI on/off (Disabled for 50-60+ FPS real-time speed)
  slice_height: 512
  slice_width: 512
  overlap_height_ratio: 0.2
  overlap_width_ratio: 0.2
  postprocess_type: "NMS"
  postprocess_match_threshold: 0.5

# Tracking settings
tracking:
  enabled: true                  # Toggle tracking on/off
  # NOTE: Custom Hungarian/IoU tracker implementation (see src/core/tracker.py).
  # Not ByteTrack. This key is informational only and not read by the code.
  tracker_type: "hungarian_iou"
  track_thresh: 0.5
  track_buffer: 30
  match_thresh: 0.8
  draw_trail: false              # Disable blue movement trajectory lines
  trail_length: 30

# Snapshot capturing configuration
snapshot:
  enabled: true
  min_confidence: 0.80           # Save snapshot only if confidence >= 80%
  save_dir: "captures"           # Base capture directory
  debounce_seconds: 5.0          # Minimum seconds between snapshots for the SAME track_id
  draw_boxes_on_snapshot: true   # Whether saved JPEG should have bbox annotated

# Event audit logging configuration
logging:
  enabled: true
  log_dir: "logs"                # Base log directory
  log_format: "jsonl"            # "jsonl" or "text"
  log_level: "INFO"

# Summary Report Generator configuration
reporting:
  enabled: true
  output_dir: "logs"
  auto_generate_on_exit: true    # Automatically produce daily Markdown report on application shutdown

# Satellite Tracking Information Panel configuration
satellite:
  enabled: true
  display_mode: "overlay"  # "overlay" to render in-frame, "window" to show in a separate window
  position: "top-right"    # "top-right" or "top-left" (for overlay mode)
  observer_lat: 41.0082    # Observer latitude (default: Istanbul)
  observer_lon: 28.9784    # Observer longitude
  update_interval_sec: 1.0 # How often to recalculate satellite positions (seconds)
  list:
    - name: "ISS (ZARYA)"
      norad_id: 25544
    - name: "GPS-BIIRM-4"
      norad_id: 28485
    - name: "STARLINK-3041"
      norad_id: 53545
    - name: "NOAA-19"
      norad_id: 33591
    - name: "TURKSAT-5A"
      norad_id: 47306

# Real-world GPS coordinate conversion for detected targets (static camera)
# Maps target pixel coordinates to WGS84 lat/lon via ground-plane intersection.
geo_mapping:
  enabled: true               # Toggle pixel -> lat/lon conversion
  camera:
    latitude: 41.0082         # Camera GPS latitude (default: Istanbul)
    longitude: 28.9784        # Camera GPS longitude
    altitude_m: 5.0           # Camera height above mean sea level (meters)
    heading_deg: 0.0          # Camera yaw: azimuth measured clockwise from North (0 = due North)
    pitch_deg: -10.0          # Camera pitch: negative = looking downward
    roll_deg: 0.0             # Camera roll (degrees)
    fov_h_deg: 70.0           # Horizontal field of view (degrees)
    fov_v_deg: 0.0            # Vertical FOV (0 = auto-derived from aspect ratio)
    reference_size: [1280, 720]  # Resolution at which FOV values were measured
  target_altitude_amsl_m: 0.0 # Assumed target (drone) altitude above mean sea level
  show_on_screen: true        # Display Lat/Lon below bounding box labels
